openapi: 3.0.0
info:
  title: SeaJobs API
  description: API для морской кадровой платформы
  version: 1.0.0
  contact:
    name: SeaJobs Team
    email: support@seajobs.com

servers:
  - url: http://localhost/api/v1
    description: Локальный сервер разработки
  - url: https://api.seajobs.com/api/v1
    description: Production сервер

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          description: ID пользователя
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [candidate, employer]
        created_at:
          type: string
          format: date-time

    Token:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string

    Vacancy:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        salary:
          type: number
        experience:
          type: string
        requirements:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        employer:
          $ref: '#/components/schemas/User'

    Resume:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        experience:
          type: string
        skills:
          type: array
          items:
            type: string
        file:
          type: string
          format: binary
        created_at:
          type: string
          format: date-time
        candidate:
          $ref: '#/components/schemas/User'

    Application:
      type: object
      properties:
        id:
          type: integer
        vacancy:
          $ref: '#/components/schemas/Vacancy'
        candidate:
          $ref: '#/components/schemas/User'
        message:
          type: string
        status:
          type: string
          enum: [pending, accepted, rejected]
        created_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: integer
        sender:
          $ref: '#/components/schemas/User'
        recipient:
          $ref: '#/components/schemas/User'
        content:
          type: string
        created_at:
          type: string
          format: date-time

paths:
  /auth/token/:
    post:
      summary: Получение JWT токена
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

  /auth/token/refresh/:
    post:
      summary: Обновление JWT токена
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
      responses:
        '200':
          description: Токен успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

  /users/register/:
    post:
      summary: Регистрация нового пользователя
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                role:
                  type: string
                  enum: [candidate, employer]
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/me/:
    get:
      summary: Получение профиля текущего пользователя
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /vacancies/:
    get:
      summary: Получение списка вакансий
      tags: [Vacancies]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: salary_min
          in: query
          schema:
            type: number
        - name: salary_max
          in: query
          schema:
            type: number
        - name: experience
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Список вакансий
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vacancy'

    post:
      summary: Создание новой вакансии
      tags: [Vacancies]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                salary:
                  type: number
                experience:
                  type: string
                requirements:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Вакансия успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'

  /resumes/:
    post:
      summary: Создание резюме
      tags: [Resumes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                experience:
                  type: string
                skills:
                  type: array
                  items:
                    type: string
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Резюме успешно создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'

    get:
      summary: Поиск резюме
      tags: [Resumes]
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: experience
          in: query
          schema:
            type: string
        - name: salary_min
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Список резюме
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resume'

  /applications/:
    post:
      summary: Отправка заявки на вакансию
      tags: [Applications]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vacancy_id:
                  type: integer
                message:
                  type: string
      responses:
        '201':
          description: Заявка успешно отправлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'

    get:
      summary: Получение списка заявок
      tags: [Applications]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список заявок
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'

  /messages/:
    post:
      summary: Отправка сообщения
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_id:
                  type: integer
                content:
                  type: string
      responses:
        '201':
          description: Сообщение успешно отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /messages/conversation/{user_id}/:
    get:
      summary: Получение диалога с пользователем
      tags: [Messages]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список сообщений
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message' 